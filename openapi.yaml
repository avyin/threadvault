openapi: 3.1.0
info:
  title: ThreadVault Local Action API
  version: 0.1.0
  description: Minimal API for saving a custom GPT conversation transcript.
servers:
  - url: http://localhost:8000
paths:
  /api/conversations/save:
    post:
      operationId: saveConversationTranscript
      summary: Save a conversation transcript
      security:
        - ThreadVaultKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationSaveRequest"
      responses:
        "200":
          description: Conversation saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  conversation_id:
                    type: string
                  message_count:
                    type: integer
                  total_transcript_chars:
                    type: integer
                  approximate_token_estimate:
                    type: integer
                  request_body_size_bytes:
                    type: integer
        "401":
          description: Missing or invalid API key
        "422":
          description: Validation failed
components:
  securitySchemes:
    ThreadVaultKey:
      type: apiKey
      in: header
      name: X-ThreadVault-Key
  schemas:
    ConversationMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
            - system
            - tool
            - unknown
        content:
          type: string
        index:
          type: integer
        approximate_timestamp:
          type: string
      additionalProperties: true
    ConversationSaveRequest:
      type: object
      required:
        - title
        - messages
        - client_reported_message_count
      properties:
        conversation_id:
          type: string
        title:
          type: string
        summary:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        raw_transcript:
          type: string
        source:
          type: string
          default: custom_gpt_action
          description: Optional source marker. The server defaults this to custom_gpt_action when omitted.
        client_reported_message_count:
          type: integer
        notes_about_completeness:
          type: string
      additionalProperties: true
